name: traceforge
services:
  db:
    image: postgres:17.7-bookworm
    environment:
      POSTGRES_USER: traceforge
      POSTGRES_PASSWORD: traceforge
      POSTGRES_DB: traceforge
    ports:
      - "127.0.0.1:54329:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U traceforge -d traceforge"]
      interval: 2s
      timeout: 3s
      retries: 30
  migrate:
    build:
      context: .
      dockerfile: infra/Dockerfile
    command: ["alembic", "upgrade", "head"]
    environment: &app-env
      TRACEFORGE_DATABASE_URL: postgresql+psycopg://traceforge:traceforge@db:5432/traceforge
      TRACEFORGE_ARTIFACT_ROOT: /data/artifacts
      TRACEFORGE_RUNNER_URL: http://runner:8765
      TRACEFORGE_RUNNER_TOKEN: ${TRACEFORGE_RUNNER_TOKEN:-local-traceforge-runner}
      TRACEFORGE_OPENAI_API_KEY: ${TRACEFORGE_OPENAI_API_KEY:-}
      TRACEFORGE_GITHUB_TOKEN: ${TRACEFORGE_GITHUB_TOKEN:-}
      TRACEFORGE_GITHUB_WEBHOOK_SECRET: ${TRACEFORGE_GITHUB_WEBHOOK_SECRET:-}
      TRACEFORGE_GITHUB_REPOSITORIES: ${TRACEFORGE_GITHUB_REPOSITORIES:-}
    depends_on:
      db:
        condition: service_healthy
  api:
    build:
      context: .
      dockerfile: infra/Dockerfile
    environment: *app-env
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - artifacts:/data/artifacts
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/ready')"]
      interval: 5s
      timeout: 5s
      retries: 10
  worker:
    build:
      context: .
      dockerfile: infra/Dockerfile
    command: ["traceforge-worker"]
    environment: *app-env
    volumes:
      - artifacts:/data/artifacts
    depends_on:
      migrate:
        condition: service_completed_successfully
    stop_grace_period: 10s
  execution-image:
    image: traceforge-execution:local
    profiles: [build]
    build:
      context: .
      dockerfile: infra/Execution.Dockerfile
  runner:
    build:
      context: .
      dockerfile: infra/Runner.Dockerfile
    environment:
      TRACEFORGE_RUNNER_TOKEN: ${TRACEFORGE_RUNNER_TOKEN:-local-traceforge-runner}
      TRACEFORGE_RUNNER_STATE: /data/runner
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - runner-state:/data/runner
    stop_grace_period: 10s
  web:
    build:
      context: .
      dockerfile: infra/Web.Dockerfile
    environment:
      TRACEFORGE_API_URL: http://api:8000
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      api:
        condition: service_healthy
volumes:
  postgres-data:
  artifacts:
  runner-state:
