[build-system]
requires = ["setuptools>=80,<83"]
build-backend = "setuptools.build_meta"

[project]
name = "traceforge"
version = "0.1.0"
description = "Deterministic CI failure ingestion and durable investigation jobs"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn>=0.34,<1", "pydantic>=2.10,<3",
  "pydantic-settings>=2.7,<3", "SQLAlchemy>=2.0,<2.1", "alembic>=1.14,<2",
  "psycopg[binary]>=3.2,<4", "httpx>=0.28,<1", "langgraph>=1,<2",
]

[project.optional-dependencies]
dev = ["pytest>=8.3,<9", "httpx>=0.28,<1", "ruff>=0.11,<1"]

[project.scripts]
traceforge-worker = "apps.worker.main:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["apps*", "packages*", "benchmarks*"]
exclude = ["benchmarks.fixtures.*"]

[tool.setuptools.package-data]
benchmarks = ["fixtures/*/*.json", "fixtures/*/*.txt", "fixtures/*/source/*.py"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--import-mode=importlib"
markers = ["integration: requires a migrated PostgreSQL database"]

[tool.ruff]
target-version = "py312"
line-length = 100
exclude = ["benchmarks/fixtures"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
